# Tool quality tests -- does the LLM pick the right tool with valid arguments?
# No documents involved. Tests the model's understanding of our tool API.
#
# Each test has explicit assertions. No profile abstraction.

# =============================================================================
# READING -- tool selection for finding/reading content
# =============================================================================

- description: 'Text search calls query_match'
  metadata: { category: reading }
  vars:
    task: 'Find all paragraphs containing the word "Introduction" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:textSearchArgs
      metric: argument_accuracy

- description: 'Node search calls query_match with node selector'
  metadata: { category: reading }
  vars:
    task: 'List all headings in the document.'
    expectedNodeType: heading
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:nodeSearchArgs
      metric: argument_accuracy

- description: 'Get document text calls get_document_text'
  metadata: { category: reading }
  vars:
    task: 'Pull the full plain text from this document so I can use it somewhere else.'
  assert:
    - type: tool-call-f1
      value: [get_document_text]
      threshold: 1.0
      metric: tool_selection

- description: 'Count occurrences uses query_match'
  metadata: { category: reading }
  vars:
    task: 'How many times does "Acme Corp" appear in this document?'
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection

# =============================================================================
# MUTATIONS -- replace, delete, insert operations
# =============================================================================

- description: 'Replace uses text.rewrite, not bare replace'
  metadata: { category: mutation }
  vars:
    task: 'Replace the text "old title" with "new title" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validOpNames
      metric: argument_accuracy
    - type: javascript
      value: file://lib/checks.cjs:noHallucinatedParams
      metric: argument_accuracy

- description: 'Delete uses text.delete with op + where fields'
  metadata: { category: mutation }
  vars:
    task: 'Remove the sentence "This is a draft document." from the introduction.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validOpNames
      metric: argument_accuracy
    - type: javascript
      value: file://lib/checks.cjs:stepFields
      metric: argument_accuracy

- description: 'Atomic multi-step has atomic: true and 2+ steps'
  metadata: { category: mutation }
  vars:
    task: 'Replace "Q1" with "Quarter 1" and "Q2" with "Quarter 2" atomically.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:atomicMultiStep
      metric: argument_accuracy

- description: 'Mutation where uses require "first", not "any"'
  metadata: { category: mutation }
  vars:
    task: 'Replace the first occurrence of "draft" with "final" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:noRequireAny
      metric: correctness

# =============================================================================
# FORMATTING -- bold, font, highlight, underline
# =============================================================================

- description: 'Bold uses format.apply with {inline: {bold: true}}'
  metadata: { category: format }
  vars:
    task: 'Make the word "Important" bold in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:correctFormatArgs
      metric: argument_accuracy

- description: 'No mixed rewrite + format in one batch'
  metadata: { category: format }
  vars:
    task: 'Replace "old text" with "new text" and make it bold.'
  assert:
    - type: javascript
      value: file://lib/checks.cjs:noMixedBatch
      metric: correctness

- description: 'Highlight text'
  metadata: { category: format, source: spreadsheet }
  vars:
    task: 'Apply yellow highlight to every occurrence of "high risk" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection

- description: 'Underline text'
  metadata: { category: format, source: spreadsheet }
  vars:
    task: 'Underline the sentence containing "payment terms" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection

# =============================================================================
# STRUCTURAL -- headings, paragraphs
# =============================================================================

- description: 'Heading uses create_heading, not text.insert'
  metadata: { category: structure }
  vars:
    task: 'Add a new heading "Chapter 2" at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_heading, discover_tools]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:noTextInsertForStructure
      metric: correctness

- description: 'Paragraph uses create_paragraph or discover_tools'
  metadata: { category: structure }
  vars:
    task: 'Add a new paragraph at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_paragraph, discover_tools]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# TABLES -- discover and operate
# =============================================================================

- description: 'Table request discovers tables group'
  metadata: { category: tables }
  vars:
    task: 'I want to work with tables in the document. Load the table editing tools.'
    expectedGroup: tables
  assert:
    - type: tool-call-f1
      value: [discover_tools]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validDiscoverGroups
      metric: argument_accuracy

- description: 'Insert a table'
  metadata: { category: tables, source: spreadsheet }
  vars:
    task: 'Insert a 4-column by 3-row table under the Pricing Details heading.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# COMMENTS
# =============================================================================

- description: 'Comment discovers comments group'
  metadata: { category: comments }
  vars:
    task: 'Add a comment on the first paragraph saying "Needs legal review".'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

- description: 'Comment on liability clauses'
  metadata: { category: comments, source: spreadsheet }
  vars:
    task: 'Add a review comment to each paragraph containing "limitation of liability" in the document.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# TRACKED CHANGES
# =============================================================================

- description: 'Tracked change sets changeMode tracked'
  metadata: { category: tracked_changes }
  vars:
    task: 'Suggest replacing "annual review" with "quarterly review" using tracked changes.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:isTrackedMode
      metric: correctness

- description: 'Direct edit does not set tracked mode'
  metadata: { category: tracked_changes }
  vars:
    task: 'Replace "draft" with "final version" in the title. Apply directly.'
  assert:
    - type: javascript
      value: file://lib/checks.cjs:isNotTrackedMode
      metric: correctness

# =============================================================================
# LISTS
# =============================================================================

- description: 'List operation discovers lists group'
  metadata: { category: lists }
  vars:
    task: 'Convert the bullet points in section 2 into a numbered list.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

- description: 'Change list numbering'
  metadata: { category: lists, source: spreadsheet }
  vars:
    task: 'Change the third level of this list to lowercase Roman numerals.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# HYGIENE
# =============================================================================

- description: 'No hallucinated doc or sessionId params'
  metadata: { category: hygiene }
  vars:
    task: 'Get the text of the entire document.'
  assert:
    - type: javascript
      value: file://lib/checks.cjs:noHallucinatedParams
      metric: argument_accuracy

- description: 'Undo calls undo tool'
  metadata: { category: history }
  vars:
    task: 'Undo that last change, it was wrong.'
  assert:
    - type: tool-call-f1
      value: [undo]
      threshold: 1.0
      metric: tool_selection

- description: 'Simple task uses 3 or fewer tool calls'
  metadata: { category: efficiency }
  vars:
    task: 'Replace the word "hello" with "goodbye" in the document.'
  assert:
    - type: javascript
      metric: efficiency
      value: "output.length <= 3"

# =============================================================================
# ASPIRATIONAL -- not fully supported yet. Failures expected.
# =============================================================================

- description: 'Aspirational: Set page margins'
  metadata: { category: aspirational, source: spreadsheet }
  vars:
