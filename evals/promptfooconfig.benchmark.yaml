# Level 3: DOCX Agent Benchmark
# 10 conditions (5 Claude Code + 5 Codex) x 18 tasks = 180 runs
#
# Run all:     pnpm run eval:benchmark
# Claude only: pnpm run eval:benchmark:claude
# Codex only:  pnpm run eval:benchmark:codex
# Report:      pnpm run eval:benchmark:report

description: 'Level 3: DOCX Agent Benchmark'

prompts:
  - '{{task}}'

providers:
  # ── Claude Code conditions ──

  - id: file://providers/claude-code-agent.mjs
    label: CC-baseline
    config:
      condition: baseline
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep']
      disallowedTools: ['Skill']
      superdocOnPath: false
      vendorSkill: false

  - id: file://providers/claude-code-agent.mjs
    label: CC-vendor
    config:
      condition: vendor
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep', 'Skill']
      superdocOnPath: false
      vendorSkill: true

  - id: file://providers/claude-code-agent.mjs
    label: CC-superdoc-skill
    config:
      condition: superdoc-skill
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep', 'Skill']
      superdocOnPath: true
      superdocSkill: true
      vendorSkill: false

  - id: file://providers/claude-code-agent.mjs
    label: CC-superdoc-cli
    config:
      condition: superdoc-cli
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep']
      disallowedTools: ['Skill']
      superdocOnPath: true
      vendorSkill: false

  - id: file://providers/claude-code-agent.mjs
    label: CC-choice
    config:
      condition: choice
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep', 'Skill']
      superdocOnPath: true
      superdocSkill: true
      vendorSkill: true

  # ── Codex conditions ──

  - id: file://providers/codex-agent.mjs
    label: Codex-baseline
    config:
      condition: baseline
      superdocOnPath: false

  - id: file://providers/codex-agent.mjs
    label: Codex-vendor
    config:
      condition: vendor
      superdocOnPath: false
      vendorSkill: true

  - id: file://providers/codex-agent.mjs
    label: Codex-superdoc-skill
    config:
      condition: superdoc-skill
      superdocOnPath: true
      superdocSkill: true

  - id: file://providers/codex-agent.mjs
    label: Codex-superdoc-cli
    config:
      condition: superdoc-cli
      superdocOnPath: true

  - id: file://providers/codex-agent.mjs
    label: Codex-choice
    config:
      condition: choice
      superdocOnPath: true
      superdocSkill: true
      vendorSkill: true

evaluateOptions:
  maxConcurrency: 2
  timeoutMs: 300000  # 5 minutes per task

tests:
  - file://tests/agent-benchmark.yaml
