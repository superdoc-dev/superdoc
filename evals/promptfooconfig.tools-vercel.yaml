# SuperDoc Tool Evals -- all providers via custom Vercel AI SDK provider.
# Run: pnpm run eval
# Filter: pnpm run eval -- --filter-providers "GPT-*"
#
# Uses a custom provider (vercel-tools.mjs) that calls the Vercel AI SDK
# with tool calling support and returns structured tool calls.
# This works with tool-call-f1 assertions unlike Promptfoo's built-in vercel: provider.

description: 'SuperDoc Tool Evals'

prompts:
  - file://prompts/agent.txt
  - file://prompts/minimal.txt

providers:
  # --- OpenAI ---
  - id: file://providers/vercel-tools.mjs
    label: GPT-4o
    config:
      modelId: openai/gpt-4o

  - id: file://providers/vercel-tools.mjs
    label: GPT-4.1-mini
    config:
      modelId: openai/gpt-4.1-mini

  - id: file://providers/vercel-tools.mjs
    label: GPT-5.4
    config:
      modelId: openai/gpt-5.4

  # --- Anthropic ---
  - id: file://providers/vercel-tools.mjs
    label: Claude Haiku 4.5
    config:
      modelId: anthropic/claude-haiku-4.5

  # --- Google ---
  - id: file://providers/vercel-tools.mjs
    label: Gemini 2.5 Flash
    config:
      modelId: google/gemini-2.5-flash

defaultTest:
  assert:
    - type: latency
      threshold: 30000

evaluateOptions:
  maxConcurrency: 10
  delay: 500
  timeoutMs: 300000

tests:
  - file://tests/tool-quality.yaml
