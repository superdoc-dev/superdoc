name: CI MCP

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-mcp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'apps/mcp/**'
              - 'packages/sdk/**'
              - 'apps/cli/**'
              - 'packages/document-api/**'
              - 'packages/superdoc/**'
              - 'packages/super-editor/**'
              - 'packages/layout-engine/**'
              - 'packages/word-layout/**'
              - 'packages/preset-geometry/**'
              - 'shared/**'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci-mcp.yml'

  validate:
    name: CI MCP / validate
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK artifacts
        run: pnpm run generate:all

      - name: Build superdoc (dependency)
        run: pnpm run build:superdoc

      - name: Build SDK (dependency)
        run: pnpm --prefix packages/sdk/langs/node run build

      - name: Build
        run: pnpm --prefix apps/mcp run build

      - name: Test
        run: pnpm --prefix apps/mcp run test
