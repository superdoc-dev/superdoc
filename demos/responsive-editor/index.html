<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperDoc Responsive Editor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-right: auto;
      }
      .btn {
        padding: 8px 16px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fff;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn:hover {
        background: #f8f8f8;
        border-color: #bbb;
      }
      .btn-primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
      }
      .file-input {
        display: none;
      }
      #toolbar {
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      #editor {
        flex: 1;
        overflow: auto;
        display: flex;
        justify-content: center;
        padding: 24px;
        background: #f5f5f5;
      }
      .version {
        font-size: 12px;
        color: #fff;
        padding: 4px 8px;
        background: #059669;
        border-radius: 4px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>SuperDoc Responsive Editor</h1>
        <span class="version" id="version">v1.45.0</span>
        <label class="btn">
          Import DOCX
          <input type="file" id="file-input" class="file-input" accept=".docx" />
        </label>
        <button class="btn btn-primary" id="export-btn">Export DOCX</button>
      </div>
      <div id="toolbar"></div>
      <div id="editor"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
