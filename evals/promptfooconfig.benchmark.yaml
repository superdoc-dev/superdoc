# Level 3: DOCX Agent Benchmark
# 10 conditions (5 Claude Code + 5 Codex) x 18 tasks = 180 runs
#
# Conditions:
#   baseline       — no SuperDoc, raw tools only
#   vendor         — no SuperDoc, vendor DOCX skill (if any)
#   superdoc-skill — SuperDoc MCP server attached (superdoc_* tools available)
#   superdoc-cli   — SuperDoc CLI on PATH only (agent discovers it via Bash)
#   choice         — SuperDoc MCP + CLI + vendor skill, agent picks approach
#   local          — uses your local Claude Code settings (MCP servers, skills, CLAUDE.md)
#
# Run all:     pnpm run eval:benchmark
# Claude only: pnpm run eval:benchmark:claude
# Codex only:  pnpm run eval:benchmark:codex
# Report:      pnpm run eval:benchmark:report

description: 'Level 3: DOCX Agent Benchmark'

prompts:
  - '{{task}}'

providers:
  # ── Claude Code conditions ──

  - id: file://providers/claude-code-agent.mjs
    label: CC-baseline
    config:
      condition: baseline
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep']
      superdocMcp: false
      superdocOnPath: false

  - id: file://providers/claude-code-agent.mjs
    label: CC-vendor
    config:
      condition: vendor
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep']
      superdocMcp: false
      superdocOnPath: false

  - id: file://providers/claude-code-agent.mjs
    label: CC-superdoc-skill
    config:
      condition: superdoc-skill
      # Only SuperDoc MCP tools + Read/Glob for discovery — no Bash to prevent raw fallback
      allowedTools: ['Read', 'Glob', 'Grep']
      superdocMcp: true
      superdocOnPath: true

  - id: file://providers/claude-code-agent.mjs
    label: CC-superdoc-cli
    config:
      condition: superdoc-cli
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep']
      superdocMcp: false
      superdocOnPath: true

  - id: file://providers/claude-code-agent.mjs
    label: CC-choice
    config:
      condition: choice
      allowedTools: ['Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep']
      superdocMcp: true
      superdocOnPath: true

  # Uses your local Claude Code config (MCP servers, skills, CLAUDE.md)
  # Run with: --filter-providers 'CC-local'
  - id: file://providers/claude-code-agent.mjs
    label: CC-local
    config:
      condition: local
      useClaudeSettings: true
      superdocOnPath: true

  # ── Codex conditions ──

  - id: file://providers/codex-agent.mjs
    label: Codex-baseline
    config:
      condition: baseline
      superdocMcp: false
      superdocOnPath: false

  - id: file://providers/codex-agent.mjs
    label: Codex-vendor
    config:
      condition: vendor
      superdocMcp: false
      superdocOnPath: false

  - id: file://providers/codex-agent.mjs
    label: Codex-superdoc-skill
    config:
      condition: superdoc-skill
      superdocMcp: true
      superdocOnPath: true

  - id: file://providers/codex-agent.mjs
    label: Codex-superdoc-cli
    config:
      condition: superdoc-cli
      superdocMcp: false
      superdocOnPath: true

  - id: file://providers/codex-agent.mjs
    label: Codex-choice
    config:
      condition: choice
      superdocMcp: true
      superdocOnPath: true

evaluateOptions:
  maxConcurrency: 2
  timeoutMs: 300000  # 5 minutes per task

tests:
  - file://tests/agent-benchmark.yaml
