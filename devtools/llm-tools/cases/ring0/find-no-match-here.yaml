testId: find_no_match_here
fixture: simple_doc.json
user: "Use the find_content tool to find all instances of the literal text 'No match here'."
allowedSequences:
  - ["find_content"]
  - ["find_content", "find_content"]
  - ["find_content", "find_content", "find_content"]
assertions:
  - type: sandbox_find_content
    pattern: "No match here"
    flags: "i"
    expectedTotal: 1
  - type: openai_trace_find_content
    description: "OpenAI trace should match only the p3 sentence."
    toolName: "find_content"
    expectedTotal: 1
    expectedBlockIds: ["p3"]
  - type: anthropic_trace_find_content
    description: "Anthropic trace should match only the p3 sentence."
    toolName: "find_content"
    expectedTotal: 1
    expectedBlockIds: ["p3"]
  - type: vercel_trace_find_content
    description: "Vercel trace should match only the p3 sentence."
    toolName: "find_content"
    expectedTotal: 1
    expectedBlockIds: []
