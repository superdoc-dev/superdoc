# GDPval benchmark -- Model+SuperDoc vs Model-Only comparison
# Uses llm-rubric assertions (costs ~$1-2 per run)
# Run: pnpm run eval:gdpval
#
# Tests whether SuperDoc tools make the model MORE capable at document editing.
# The tool-augmented model gets our full prompt + 6 tools.
# The baseline model gets a minimal prompt + no tools.
# The LLM judge scores both responses against the same rubric.

description: 'GDPval: SuperDoc tool augmentation vs model-only baseline'

prompts:
  - id: file://prompts/agent.txt
    label: 'SuperDoc agent prompt'
  - id: file://prompts/minimal.txt
    label: 'Minimal baseline prompt'

providers:
  - id: openai:chat:gpt-5.4
    label: 'GPT-5.4 + SuperDoc'
    prompts:
      - 'SuperDoc agent prompt'
    config:
      temperature: 0
      seed: 42
      tools: file://lib/essential.json
      tool_choice: required

  - id: openai:chat:gpt-5.4
    label: 'GPT-5.4 Only (no tools)'
    prompts:
      - 'Minimal baseline prompt'
    config:
      temperature: 0
      seed: 42

tests:
  - file://tests/gdpval-workflows.yaml

outputPath: results/gdpval-latest.json
