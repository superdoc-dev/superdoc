name: CI Template Builder

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-template-builder-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs --suite template-builder

  validate:
    name: CI Template Builder / validate
    needs: gate
    # Run when gate succeeded with should_run='true' (do work) OR when the
    # gate itself failed (so we can fail explicitly below). If gate succeeded
    # with should_run='false', this job is skipped, which counts as success
    # for required status checks.
    if: always() && (needs.gate.result != 'success' || needs.gate.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify gate succeeded
        if: needs.gate.result != 'success'
        run: |
          echo "Gate did not succeed (result: ${{ needs.gate.result }})."
          exit 1

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build superdoc (dependency)
        run: pnpm run build:superdoc

      - name: Lint
        run: pnpm --filter @superdoc-dev/template-builder lint

      - name: Type check
        run: pnpm --filter @superdoc-dev/template-builder type-check

      - name: Build
        run: pnpm --filter @superdoc-dev/template-builder build

      - name: Test
        run: pnpm --filter @superdoc-dev/template-builder test
