name: CI VS Code Extension

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-vscode-ext-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'apps/vscode-ext/**'
              - 'packages/superdoc/**'
              - 'packages/super-editor/**'
              - 'packages/layout-engine/**'
              - 'packages/word-layout/**'
              - 'packages/preset-geometry/**'
              - 'shared/**'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci-vscode-ext.yml'

  validate:
    name: CI VS Code Extension / validate
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter superdoc-vscode-ext lint

      - name: Type check
        run: pnpm --filter superdoc-vscode-ext typecheck

      - name: Test
        run: pnpm --filter superdoc-vscode-ext test

      - name: Build extension host
        run: pnpm --filter superdoc-vscode-ext compile:ext
