# Level 3: DOCX Agent Benchmark — fidelity suite (v2)
#
# 6 tasks designed so that raw XML manipulation (unzip + sed) will pass text checks
# but FAIL fidelity checks, while SuperDoc MCP preserves OOXML structure.
#
# Metrics per task: correctness, collateral, fidelity, diff, steps, latency, tokens, path

# ── TASK 1: Mixed formatting replace ──

- description: 'Fidelity: mixed formatting replace'
  vars:
    fixture: consulting-agreement.docx
    keepFile: true
    task: 'Replace the term "Confidential Information" with "Proprietary Information" everywhere in the document, preserving bold and italic formatting on each occurrence.'
    fidelityChecks: '[{"type":"formatting","text":"Proprietary Information","property":"bold"}]'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (!t.includes('Proprietary Information')) return { pass: false, score: 0, reason: '"Proprietary Information" not found' };
        if (t.includes('Confidential Information')) return { pass: false, score: 0, reason: 'Old term "Confidential Information" still present' };
        return { pass: true, score: 1, reason: 'Term replaced correctly' };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (!t.includes('Astra Dynamics')) return { pass: false, score: 0, reason: 'Collateral: "Astra Dynamics" removed' };
        if (d.documentChanged !== true) return { pass: false, score: 0, reason: 'documentChanged should be true' };
        return { pass: true, score: 1, reason: 'Collateral content intact' };
    - type: javascript
      metric: fidelity
      value: file://lib/checks.cjs:benchmarkFidelity
    - type: javascript
      metric: diff
      weight: 0
      value: file://lib/checks.cjs:benchmarkDiff
    - type: javascript
      metric: steps
      weight: 0
      value: file://lib/checks.cjs:benchmarkSteps
    - type: javascript
      metric: latency
      weight: 0
      value: file://lib/checks.cjs:benchmarkLatency
    - type: javascript
      metric: tokens
      weight: 0
      value: file://lib/checks.cjs:benchmarkTokens
    - type: javascript
      metric: path
      value: file://lib/checks.cjs:benchmarkPath

# ── TASK 2: Table cell edit ──

- description: 'Fidelity: table cell edit'
  vars:
    fixture: pricing-proposal.docx
    keepFile: true
    task: 'In the pricing table, update the Enterprise plan monthly price from $399 to $500. Do not change any other values or formatting in the table.'
    fidelityChecks: '[{"type":"tableCell","table":0,"row":3,"col":1,"text":"500"}]'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (!t.includes('500')) return { pass: false, score: 0, reason: '"500" not found in document' };
        return { pass: true, score: 1, reason: 'Price updated correctly' };
    - type: javascript
