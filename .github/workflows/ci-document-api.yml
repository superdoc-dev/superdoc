name: CI Document API

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-document-api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs --suite document-api

  validate:
    name: CI Document API / validate
    needs: gate
    # Run when gate succeeded with should_run='true' (do work) OR when the
    # gate itself failed (so we can fail explicitly below). If gate succeeded
    # with should_run='false', this job is skipped, which counts as success
    # for required status checks.
    if: always() && (needs.gate.result != 'success' || needs.gate.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify gate succeeded
        if: needs.gate.result != 'success'
        run: |
          echo "Gate did not succeed (result: ${{ needs.gate.result }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate contract outputs
        run: pnpm run docapi:sync

      - name: Check overview.mdx freshness
        run: git diff --exit-code apps/docs/document-api/overview.mdx

      - name: Check contract parity and generated outputs
        run: pnpm run docapi:check
