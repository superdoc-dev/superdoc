# GDPval workflow tests -- compare tool-augmented vs baseline model responses.
#
# These use llm-rubric (LLM-as-judge) assertions.
#
# IMPORTANT: Rubrics must be fair to BOTH providers:
# - The tool-augmented model returns TOOL CALLS (structured JSON).
#   In single-turn eval, it returns only the FIRST action (usually query_match).
# - The baseline model returns TEXT describing what it would do.
#
# Rubrics score: does the response show a concrete, executable approach?
# Tool calls are concrete by definition. Text descriptions must be specific.

- description: 'GDPval: Find and replace text'
  vars:
    task: 'Find the phrase "Q3 Revenue" and replace it with "Q3 2025 Revenue".'
  assert:
    - type: llm-rubric
      value: |
        Score the response on how concretely it approaches a find-and-replace task.

        A HIGH score (0.8-1.0): The response shows a specific, executable first step.
        This could be a structured tool call that searches for the text (e.g., query_match
        with a pattern), OR a text response that names the exact operation and parameters
        needed (not just "I would find and replace it").

        A LOW score (0.0-0.3): The response is vague ("I would search for the text and
        replace it") without specifying how, or suggests manual editing.

        NOTE: A response that only shows the SEARCH step (without the replace step) still
        scores high if the search is concrete and correct, because the replace naturally
        follows in a subsequent turn.
      threshold: 0.6

- description: 'GDPval: Multi-step document query'
  vars:
    task: 'List all the headings in the document and tell me which section contains a table.'
  assert:
    - type: llm-rubric
      value: |
        Score the response on its approach to querying document structure.

        A HIGH score (0.8-1.0): Shows a systematic approach to finding headings and tables.
        A structured tool call querying headings or node types scores high. A text response
        that describes querying by node type (headings, tables) with specific steps also
        scores high.

        A LOW score (0.0-0.3): Vague response like "I would look through the document"
        without specifying how to identify headings or tables programmatically.
      threshold: 0.6

- description: 'GDPval: Insert content at specific location'
  vars:
    task: 'Add a new paragraph "Summary of Changes" right before the last heading in the document.'
  assert:
    - type: llm-rubric
      value: |
        Score the response on its ability to locate a position and insert content.

        A HIGH score (0.8-1.0): Shows awareness that you need to FIND the last heading
        first, then INSERT relative to it. A tool call that searches for headings scores
        high (it is the correct first step). A text response that describes the two-step
        approach (find position, then insert) with specific operations also scores high.

        A LOW score (0.0-0.3): Suggests adding content without explaining how to find the
        target position, or describes it vaguely.
      threshold: 0.5

- description: 'GDPval: Discover and use extended tools'
  vars:
    task: 'Create a 3-column table with headers "Name", "Role", "Department" after the first paragraph.'
  assert:
    - type: llm-rubric
      value: |
        Score the response on its approach to creating a table (a capability that requires
        loading additional tools beyond the essential set).

        A HIGH score (0.8-1.0): Shows awareness that table creation is a specialized
        operation. A tool call to discover_tools or create_table scores high. A text
        response that acknowledges needing specialized table creation capabilities also
        scores high.

        A LOW score (0.0-0.3): Tries to create a table using basic text operations, or
        suggests pasting HTML/markdown without acknowledging the need for a table creation
        tool.
      threshold: 0.5

- description: 'GDPval: Track changes workflow'
  vars:
    task: 'Replace "Draft" with "Final" in the document title, but use tracked changes so it can be reviewed.'
  assert:
    - type: llm-rubric
      value: |
        Score the response on understanding of tracked changes (suggesting edits for review
        rather than applying them directly).

        A HIGH score (0.8-1.0): Shows understanding that this requires a "tracked" or
        "suggestion" mode rather than direct editing. A tool call with changeMode "tracked"
        or a search for the text to modify scores high. A text response that describes
        using tracked/suggestion mode specifically also scores high.

        A LOW score (0.0-0.3): Describes a direct replacement without mentioning tracked
        changes, suggestion mode, or review capability.
      threshold: 0.5
