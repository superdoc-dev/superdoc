name: CI Docs

on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs --suite docs

  validate:
    name: CI Docs / validate
    needs: gate
    # Run when gate succeeded with should_run='true' (do work) OR when the
    # gate itself failed (so we can fail explicitly below). If gate succeeded
    # with should_run='false', this job is skipped, which counts as success
    # for required status checks.
    if: always() && (needs.gate.result != 'success' || needs.gate.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify gate succeeded
        if: needs.gate.result != 'success'
        run: |
          echo "Gate did not succeed (result: ${{ needs.gate.result }})."
          exit 1

      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate all artifacts
        run: pnpm run generate:all

      - name: Validate Docs
        run: pnpm --filter @superdoc/docs validate

      - name: Check Broken Links
        run: pnpm --filter @superdoc/docs check:links

      - name: Check Code Imports
        run: pnpm --filter @superdoc/docs check:imports

      - name: Build Packages
        run: pnpm --prefix packages/superdoc run build

      - name: Test Code Examples
        run: pnpm --filter @superdoc/docs test:examples
