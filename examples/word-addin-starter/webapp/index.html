<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperDoc - Web Editor</title>

    <!-- SuperDoc from CDN -->
    <link rel="stylesheet" href="https://unpkg.com/superdoc@0.21.0-next.1/dist/style.css">
    <script src="https://unpkg.com/superdoc@0.21.0-next.1/dist/superdoc.umd.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", -apple-system, sans-serif;
            background: #f5f5fa;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1255fe 0%, #8968f6 50%, #b785f1 100%);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }
        .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            font-size: 13px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }
        .status-dot.connected { background: #28a745; }
        .status-dot.connecting { background: #ffc107; }
        .status-dot.disconnected { background: #dc3545; }
        .status-dot.syncing { background: #17a2b8; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        .container {
            margin: 24px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .editor-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }
        #toolbar {
            padding: 8px 12px;
            border-bottom: 1px solid #e1e5e9;
            background: #fafafa;
            overflow-x: auto;
            white-space: nowrap;
        }
        #superdoc {
            min-height: 700px;
            display: flex;
            justify-content: center;
        }
        .info {
            margin-top: 16px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 14px;
            color: #605e5c;
            width: 100%;
            max-width: 900px;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>SuperDoc</h1>
        <div class="status">
            <div id="statusDot" class="status-dot connecting"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <div class="container">
        <div class="editor-card">
            <div id="toolbar"></div>
            <div id="superdoc"></div>
        </div>

        <div class="info">
            This editor syncs in real-time with Microsoft Word via the SuperDoc add-in.
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
