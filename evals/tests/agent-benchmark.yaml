# =============================================================================
# EDITING TASKS (11) — validate documentText after edits, doc must change
# =============================================================================

- description: 'Edit: replace entity name throughout'
  vars:
    fixture: nda.docx
    keepFile: true
    task: 'Replace every instance of "Iqidis" with "SuperDoc Inc" throughout the document.'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (!t.includes('SuperDoc Inc')) return { pass: false, score: 0, reason: 'SuperDoc Inc not found in document' };
        if (t.includes('Iqidis')) return { pass: false, score: 0, reason: 'Old name Iqidis still present' };
        return { pass: true, score: 1, reason: 'Entity name replaced correctly' };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (!t.includes('TechVentures')) return { pass: false, score: 0, reason: 'Collateral damage: TechVentures was removed' };
        if (d.documentChanged !== true) return { pass: false, score: 0, reason: 'documentChanged should be true' };
        return { pass: true, score: 1, reason: 'TechVentures intact, document changed' };
    - type: javascript
      metric: efficiency
      value: file://lib/checks.cjs:benchmarkMetrics

- description: 'Edit: add paragraph after a heading'
  vars:
    fixture: document.docx
    keepFile: true
    task: 'Find the first heading in the document and add a paragraph immediately after it that says "This section has been reviewed and approved."'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (!t.includes('reviewed and approved')) return { pass: false, score: 0, reason: '"reviewed and approved" not found in document' };
        return { pass: true, score: 1, reason: 'Paragraph added after heading' };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        if (d.documentChanged !== true) return { pass: false, score: 0, reason: 'documentChanged should be true' };
        return { pass: true, score: 1, reason: 'Document was modified as expected' };
    - type: javascript
      metric: efficiency
      value: file://lib/checks.cjs:benchmarkMetrics

- description: 'Edit: convert bullet list to numbered list'
  vars:
    fixture: document.docx
    keepFile: true
    task: 'Convert the bullet list in this document to a numbered list.'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        if (!d.documentText) return { pass: false, score: 0, reason: 'No documentText in output' };
        if (d.documentChanged !== true) return { pass: false, score: 0, reason: 'documentChanged should be true after list conversion' };
        return { pass: true, score: 1, reason: 'List conversion attempted and document changed' };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        const t = d.documentText || '';
        if (t.length < 10) return { pass: false, score: 0, reason: 'Document appears empty after edit' };
        return { pass: true, score: 1, reason: 'Document content preserved' };
    - type: javascript
      metric: efficiency
      value: file://lib/checks.cjs:benchmarkMetrics

