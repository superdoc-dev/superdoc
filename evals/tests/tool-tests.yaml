# Tool call tests -- validates tool selection, argument structure, and correctness rules.
# Merged from reading-tools, argument-accuracy, and tool-correctness.

# --- TOOL SELECTION (does the model pick the right tool?) ---

- description: 'Text search calls query_match with text selector'
  metadata: { category: reading }
  vars:
    task: 'Find all paragraphs containing the word "Introduction" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      weight: 2
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:textSearchArgs
      metric: argument_accuracy

- description: 'Node search calls query_match with node selector'
  metadata: { category: reading }
  vars:
    task: 'List all headings in the document.'
    expectedNodeType: heading
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      weight: 2
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:nodeSearchArgs
      metric: argument_accuracy

- description: 'Get document text calls get_document_text'
  metadata: { category: reading }
  vars:
    task: 'Show me the full text content of this document.'
  assert:
    - type: tool-call-f1
      value: [get_document_text]
      threshold: 1.0
      metric: tool_selection

- description: 'Get node by ID calls get_node_by_id'
  metadata: { category: reading }
  vars:
    task: 'Get the contents of the node with ID "abc123".'
  assert:
    - type: tool-call-f1
      value: [get_node_by_id]
      threshold: 1.0
      metric: tool_selection

- description: 'Formatting request calls a tool (not text)'
  metadata: { category: reading }
  vars:
    task: 'I need to change the font of a paragraph to Arial.'
  assert:
    - type: javascript
      metric: tool_selection
      value: output.length > 0

# --- ARGUMENT ACCURACY (are the arguments correct?) ---

- description: 'apply_mutations uses text.rewrite (not bare replace)'
  metadata: { category: arguments }
  vars:
    task: 'Replace the text "old title" with "new title" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:validOpNames
      weight: 2
      metric: argument_accuracy

- description: 'apply_mutations steps have op and where fields'
  metadata: { category: arguments }
  vars:
    task: 'Delete the sentence "remove this text" from the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:stepFields
      metric: argument_accuracy

- description: 'No hallucinated doc or sessionId parameters'
  metadata: { category: arguments }
  vars:
    task: 'Get the text of the entire document.'
  assert:
    - type: javascript
      value: file://lib/assertions.cjs:noHallucinatedParams
      weight: 2
      metric: parameter_hygiene

- description: 'discover_tools passes valid group names'
  metadata: { category: arguments }
  vars:
    task: 'I want to work with tables in the document. Load the table editing tools.'
    expectedGroup: tables
  assert:
    - type: tool-call-f1
      value: [discover_tools]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:validDiscoverGroups
      metric: argument_accuracy

# --- CORRECTNESS RULES (production patterns from labs) ---

- description: 'Heading uses create_heading, not text.insert'
  metadata: { category: correctness }
  vars:
    task: 'Add a new heading "Chapter 2" at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_heading, discover_tools]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:noTextInsertForStructure
      weight: 2
      metric: correctness

- description: 'Paragraph uses create_paragraph or discover_tools'
  metadata: { category: correctness }
  vars:
    task: 'Add a new paragraph at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_paragraph, discover_tools]
      threshold: 0.5
      metric: tool_selection

- description: 'Mutation where uses require "first" not "any"'
  metadata: { category: correctness }
  vars:
    task: 'Replace the first occurrence of "draft" with "final" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/assertions.cjs:noRequireAny
      weight: 2
      metric: correctness

- description: 'format.apply uses inline object structure'
  metadata: { category: correctness }
  vars:
    task: 'Make the word "Important" bold in the document.'
  assert:
    - type: javascript
      value: file://lib/assertions.cjs:correctFormatArgs
      metric: correctness

- description: 'Does not combine rewrite and format in one batch'
  metadata: { category: correctness }
  vars:
    task: 'Replace "old text" with "new text" and make it bold.'
  assert:
    - type: javascript
      value: file://lib/assertions.cjs:noMixedBatch
      weight: 2
      metric: correctness

- description: 'Comment request discovers comments group'
  metadata: { category: correctness }
  vars:
    task: 'Add a comment on the first paragraph saying "Needs legal review".'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection
