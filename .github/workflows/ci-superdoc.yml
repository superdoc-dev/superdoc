name: CI SuperDoc

permissions:
  contents: read

on:
  pull_request:
    branches: [main, stable, 'release/**']
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-superdoc-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ci-superdoc formerly used paths-ignore to opt out of unrelated packages;
  # moving to the gate pattern means we express the same intent as a positive
  # include list. Scope: core engine + cli + root tooling. Everything else
  # (react, sdk, mcp, vscode-ext, template-builder, esign, demos, examples,
  # docs, evals) has its own CI workflow.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/superdoc/**'
              - 'packages/super-editor/**'
              - 'packages/layout-engine/**'
              - 'packages/word-layout/**'
              - 'packages/preset-geometry/**'
              - 'packages/document-api/**'
              - 'packages/collaboration-yjs/**'
              - 'shared/**'
              - 'apps/cli/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.nvmrc'
              - 'tsconfig*.json'
              - 'eslint.config.mjs'
              - 'vitest.config.mjs'
              - 'vitest.baseConfig.ts'
              - '.github/workflows/ci-superdoc.yml'

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install canvas system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format --check

      - name: Build
        run: pnpm run build

      - name: Validate command types
        run: node scripts/validate-command-types.mjs

      - name: Typecheck
        run: pnpm run type-check

      - name: Consumer typecheck
        run: |
          cd packages/superdoc && pnpm pack --pack-destination .
          cd ../../tests/consumer-typecheck
          npm install ../../packages/superdoc/superdoc-*.tgz --no-save
          npx tsc --noEmit

  unit-tests:
    needs: [gate, build]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: super-editor-1
            shard: '1/4'
          - name: super-editor-2
            shard: '2/4'
          - name: super-editor-3
            shard: '3/4'
          - name: super-editor-4
            shard: '4/4'
          - name: other-packages
            shard: ''
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install canvas system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run super-editor tests (shard ${{ matrix.shard }})
        if: matrix.name != 'other-packages'
        working-directory: packages/super-editor
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: >-
          pnpm exec vitest run --pool forks --minWorkers 1 --maxWorkers 1
          --shard=${{ matrix.shard }}
          --exclude='**/decrypt-docx.integration*'
          --exclude='**/contract-conformance*'

      - name: Run other package vitest tests
        if: matrix.name == 'other-packages'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITEST_MAX_WORKERS: '1'
          VITEST_MIN_WORKERS: '1'
        run: pnpm exec vitest run '--project=!*super-editor*'

      - name: Run bun tests
        if: matrix.name == 'other-packages'
        run: |
          pnpm -r --parallel \
            --filter @superdoc/document-api \
            --filter @superdoc/layout-engine --filter @superdoc/style-engine \
            --filter @superdoc/geometry-utils --filter @superdoc/word-layout \
            --filter @superdoc/common --filter @font-utils \
            --filter @locale-utils --filter @url-validation \
            test

      - name: Run SDK scripts tests
        if: matrix.name == 'other-packages'
        run: pnpm --prefix packages/sdk run test:scripts

      - name: Run memory profiling tests (non-blocking)
        if: matrix.name == 'other-packages'
        continue-on-error: true
        run: pnpm --filter @superdoc/layout-tests run test:memory

      - name: Run slow tests
        if: matrix.name == 'other-packages'
        run: pnpm test:slow

      - name: Install Playwright for CDN smoke test
        if: matrix.name == 'other-packages'
        run: pnpm --filter @superdoc/cdn-smoke-test exec playwright install --with-deps chromium

      - name: Run CDN smoke test
        if: matrix.name == 'other-packages'
        working-directory: packages/superdoc/tests/cdn-smoke
        run: pnpm test

  cli-tests:
    needs: [gate, build]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: pnpm install

      - name: Build superdoc (CLI runtime dependency)
        run: pnpm run build:superdoc

      - name: Run CLI tests
        run: pnpm run test:cli

  coverage:
    needs: [gate, build]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @superdoc-dev/superdoc-yjs-collaboration build

      - run: pnpm --filter superdoc exec vitest run --coverage

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/superdoc/coverage/lcov.info
          flags: superdoc

  validate:
    name: CI SuperDoc / validate
    needs: [gate, build, unit-tests, cli-tests, coverage]
    # always() is load-bearing: without it, GitHub implicitly requires success()
    # on every needed job, so a failing unit-tests job would cause validate to
    # skip instead of run - and skipped jobs count as success for required
    # status checks, so the PR would merge despite a failure. always() forces
    # the job to run regardless of upstream results, and the script below
    # evaluates each needs.*.result explicitly. The gate-result check is the
    # other half: if the gate itself failed (checkout error, runner blip),
    # should_run is empty and the previous condition (should_run == 'true')
    # would have skipped validate - silently green-lighting merge. Always
    # running validate and failing on a non-success gate closes that gap.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.gate.result }}" != "success" ]]; then
            echo "Gate did not succeed (result: ${{ needs.gate.result }})."
            exit 1
          fi

          if [[ "${{ needs.gate.outputs.should_run }}" != "true" ]]; then
            echo "Workflow not required for this PR."
            exit 0
          fi

          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
