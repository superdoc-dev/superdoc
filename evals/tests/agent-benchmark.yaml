# Agent benchmark tests — 18 tasks for Level 3 AI agent comparison.
#
# Evaluates real document understanding and editing across 5 provider conditions
# (Claude Code SDK + Codex). Each task tests one capability dimension.
#
# Structure:
#   - 7 reading tasks: validate agentResponseText, assert documentChanged === false
#   - 11 editing tasks: validate documentText after edits, assert documentChanged === true
#
# Every task includes benchmarkMetrics for efficiency comparison across conditions.

# =============================================================================
# READING TASKS (7) — validate what the agent said, doc must not change
# =============================================================================

- description: 'Read: extract all headings'
  vars:
    fixture: report-with-formatting.docx
    task: 'List all headings in this document.'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = (d.agentResponseText || '').toLowerCase();
        const found = ['executive summary', 'study overview', 'enrollment', 'safety', 'efficacy'].filter(h => t.includes(h));
        if (found.length < 2) return { pass: false, score: 0, reason: `Only found: ${found.join(', ')} — expected at least 2 headings from clinical trial report` };
        return { pass: true, score: 1, reason: `Headings found: ${found.join(', ')}` };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        if (d.documentChanged !== false) return { pass: false, score: 0, reason: 'Document was modified — reading task should not change document' };
        return { pass: true, score: 1, reason: 'Document unchanged' };
    - type: javascript
      metric: efficiency
      value: file://lib/checks.cjs:benchmarkMetrics

- description: 'Read: content of a specific section'
  vars:
