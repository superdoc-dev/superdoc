      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = d.agentResponseText || '';
        if (t.length < 50) return { pass: false, score: 0, reason: `Response too short (${t.length} chars) — expected section content` };
        return { pass: true, score: 1, reason: `Section content returned (${t.length} chars)` };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        if (d.documentChanged !== false) return { pass: false, score: 0, reason: 'Document was modified — reading task should not change document' };
        return { pass: true, score: 1, reason: 'Document unchanged' };
    - type: javascript
      metric: efficiency
      value: file://lib/checks.cjs:benchmarkMetrics

- description: 'Read: count items in a bulleted list'
  vars:
    fixture: document.docx
    task: 'How many items are in the bulleted list in this document?'
  assert:
    - type: javascript
      metric: correctness
      value: |
        const d = JSON.parse(output);
        const t = d.agentResponseText || '';
        const numbers = t.match(/\d+/g) || [];
        const hasValidCount = numbers.some(n => parseInt(n) >= 3);
        if (!hasValidCount) return { pass: false, score: 0, reason: `No number >= 3 found in response: "${t.substring(0, 100)}"` };
        return { pass: true, score: 1, reason: `Count reported: ${numbers.join(', ')}` };
    - type: javascript
      metric: collateral
      value: |
        const d = JSON.parse(output);
        if (d.documentChanged !== false) return { pass: false, score: 0, reason: 'Document was modified — reading task should not change document' };
        return { pass: true, score: 1, reason: 'Document unchanged' };
    - type: javascript
      metric: efficiency
      value: file://lib/checks.cjs:benchmarkMetrics

