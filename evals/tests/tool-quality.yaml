# Tool quality tests -- explicit assertions, no profile abstraction.
# Every test lists its assertions directly so anyone can read it.

# =============================================================================
# READING -- does the model find/read content?
# =============================================================================

- description: 'Text search calls query_match'
  metadata: { category: reading }
  vars:
    task: 'Find all paragraphs containing the word "Introduction" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:textSearchArgs        # select.type === "text", pattern exists
      metric: argument_accuracy

- description: 'Node search calls query_match with node selector'
  metadata: { category: reading }
  vars:
    task: 'List all headings in the document.'
    expectedNodeType: heading
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:nodeSearchArgs         # select.type === "node", nodeType matches
      metric: argument_accuracy

- description: 'Get document text calls get_document_text'
  metadata: { category: reading }
  vars:
    task: 'Pull the full plain text from this document so I can use it somewhere else.'
  assert:
    - type: tool-call-f1
      value: [get_document_text]
      threshold: 1.0
      metric: tool_selection

- description: 'Count occurrences uses query_match'
  metadata: { category: reading, source: spreadsheet }
  vars:
    task: 'How many times does "Acme Corp" appear in this document, and where are the first five mentions?'
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection

- description: 'Pull headings in order'
  metadata: { category: reading, source: spreadsheet }
  vars:
    task: 'Pull out all the headings in this document in order.'
    expectedNodeType: heading
  assert:
    - type: tool-call-f1
      value: [query_match, get_document_text]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# MUTATIONS -- find and replace, delete, insert
# =============================================================================

- description: 'Replace text uses text.rewrite op'
  metadata: { category: mutation }
  vars:
    task: 'Replace the text "old title" with "new title" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validOpNames           # uses text.rewrite, not "replace"
      metric: argument_accuracy
    - type: javascript
      value: file://lib/checks.cjs:noHallucinatedParams
      metric: argument_accuracy

- description: 'Delete text uses text.delete'
  metadata: { category: mutation }
  vars:
    task: 'Remove the sentence "This is a draft document." from the introduction.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validOpNames
      metric: argument_accuracy
    - type: javascript
      value: file://lib/checks.cjs:stepFields              # steps have op + where
      metric: argument_accuracy

- description: 'Replace placeholder throughout (customer prompt)'
  metadata: { category: mutation, source: spreadsheet }
  vars:
    task: 'Replace the placeholder value [ClientName] with "Acme Corporation" throughout the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validOpNames
      metric: argument_accuracy

- description: 'Replace shall with must (customer prompt)'
  metadata: { category: mutation, source: spreadsheet }
  vars:
    task: 'Find every instance of "shall" and replace it with "must" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'Atomic multi-step replace'
  metadata: { category: mutation }
  vars:
    task: 'Replace "Q1" with "Quarter 1" and "Q2" with "Quarter 2" in the financial summary. Do both changes atomically.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:atomicMultiStep          # atomic: true, 2+ steps
      metric: argument_accuracy

- description: 'Does not use require "any" in mutations'
  metadata: { category: mutation }
  vars:
    task: 'Replace the first occurrence of "draft" with "final" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:noRequireAny             # require: "first" not "any"
      metric: correctness

# =============================================================================
# FORMATTING -- bold, font, highlight, underline
# =============================================================================

- description: 'Bold uses format.apply with inline structure'
  metadata: { category: format }
  vars:
    task: 'Make the word "Important" bold in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:correctFormatArgs        # { inline: { bold: true } }
      metric: argument_accuracy

- description: 'Does not combine rewrite and format in one batch'
  metadata: { category: format }
  vars:
    task: 'Replace "old text" with "new text" and make it bold.'
  assert:
    - type: javascript
      value: file://lib/checks.cjs:noMixedBatch             # no text.rewrite + format.apply together
      metric: correctness

- description: 'Change headings to 12pt (customer prompt)'
  metadata: { category: format, source: spreadsheet }
  vars:
    task: 'Make all the headings in this document 12-point font.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection

- description: 'Apply highlight to text (customer prompt)'
  metadata: { category: format, source: spreadsheet }
  vars:
    task: 'Apply yellow highlight to every occurrence of "high risk" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection

- description: 'Underline specific text (customer prompt)'
  metadata: { category: format, source: spreadsheet }
  vars:
    task: 'Underline the sentence containing "payment terms" in the document.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations, discover_tools]
      threshold: 0.3
      metric: tool_selection

# =============================================================================
# STRUCTURAL -- headings, paragraphs, content insertion
# =============================================================================

- description: 'Add heading uses create_heading, not text.insert'
  metadata: { category: structure }
  vars:
    task: 'Add a new heading "Chapter 2" at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_heading, discover_tools]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:noTextInsertForStructure  # not text.insert inside apply_mutations
      metric: correctness

- description: 'Add paragraph uses create_paragraph'
  metadata: { category: structure }
  vars:
    task: 'Add a new paragraph at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_paragraph, discover_tools]
      threshold: 0.5
      metric: tool_selection

- description: 'Insert CONFIDENTIAL at top (customer prompt)'
  metadata: { category: structure, source: spreadsheet }
  vars:
    task: 'Insert the word CONFIDENTIAL at the very top of the document.'
  assert:
    - type: tool-call-f1
      value: [apply_mutations, create_paragraph, discover_tools]
      threshold: 0.3
      metric: tool_selection

- description: 'Add heading + content (customer prompt)'
  metadata: { category: structure, source: spreadsheet }
  vars:
    task: 'Add a heading called "Legal Risk Summary" at the top of the document and insert a 5-bullet risk recap underneath.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match, create_heading]
      threshold: 0.3
      metric: tool_selection

# =============================================================================
# TABLES -- discover tools, add rows, insert table
# =============================================================================

- description: 'Table request discovers tables group'
  metadata: { category: tables }
  vars:
    task: 'I want to work with tables in the document. Load the table editing tools.'
    expectedGroup: tables
  assert:
    - type: tool-call-f1
      value: [discover_tools]
      threshold: 1.0
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:validDiscoverGroups
      metric: argument_accuracy

- description: 'Add rows to table (customer prompt)'
  metadata: { category: tables, source: spreadsheet }
  vars:
    task: 'Add three new rows to my table.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

- description: 'Insert a table (customer prompt)'
  metadata: { category: tables, source: spreadsheet }
  vars:
    task: 'Insert a 4-column by 3-row table under the Pricing Details heading.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

