# Cross-provider comparison -- realistic customer experience.
# Run: pnpm run eval:cross
#
# Tests two things:
# 1. Do different providers pick the right tool?
# 2. Does our full system prompt improve results vs a minimal one?
#
# The minimal prompt is what a customer would actually write.
# The full prompt is what our labs agent uses.
# The gap between them shows the value of our documentation.

description: 'SuperDoc Cross-Provider Comparison'

prompts:
  - id: file://prompts/minimal.txt
    label: 'Minimal prompt (customer)'
  - id: file://prompts/agent.txt
    label: 'Full prompt (labs agent)'

providers:
  - id: openai:chat:gpt-5.4
    label: GPT-5.4
    config:
      temperature: 0
      seed: 42
      tools: file://lib/essential.json
      tool_choice: required
      timeout: 30000

  - id: anthropic:messages:claude-sonnet-4-6
    label: Claude Sonnet 4.6
    config:
      temperature: 0
      tools: file://lib/essential.json
      tool_choice: auto
      timeout: 30000
      max_tokens: 1024
      maxRetries: 3

  - id: google:gemini-2.5-pro
    label: Gemini 2.5 Pro
    config:
      temperature: 0
      tools: file://lib/essential.json
      maxOutputTokens: 1024
      timeout: 30000

defaultTest:
  options:
    transform: file://lib/normalize.cjs
  assert:
    - type: latency
      threshold: 30000

evaluateOptions:
  maxConcurrency: 3
  delay: 1000
  timeoutMs: 60000

tests:
  - file://tests/cross-provider.yaml
