# Execution tests -- real document editing via SuperDoc CLI.
#
# Each test opens a fresh copy of document.docx, runs the agent, checks the result.
# Assertions verify BOTH that new content exists AND that old content changed.

- description: 'Agent can read document content'
  vars:
    fixture: document.docx
    task: 'Get the full text of this document.'
  assert:
    # Proves the agent actually read the document (known content)
    - type: contains
      value: 'A list of list features'
    - type: contains
      value: 'We support bullets, symbols and more'
    - type: contains
      value: 'All sorts of lists are supported'

- description: 'Agent can add a paragraph at the end'
  vars:
    fixture: document.docx
    task: 'Add a new paragraph at the end of the document that says exactly "EVAL TEST PASSED".'
  assert:
    # New content exists
    - type: contains
      value: 'EVAL TEST PASSED'
    # Original content still there (not overwritten)
    - type: contains
      value: 'A list of list features'

- description: 'Agent can find and replace text'
  vars:
    fixture: document.docx
    task: 'Replace "bullets" with "bullet points" everywhere in the document.'
  assert:
    # New text exists
    - type: contains
      value: 'bullet points'
    # Old text is gone (proves it was replaced, not just appended)
    - type: not-contains
      value: 'support bullets,'
    # Rest of document intact
    - type: contains
      value: 'Nested lists'

- description: 'Agent can add a heading at the end'
  vars:
    fixture: document.docx
    task: 'Add a heading "Summary" at the end of the document.'
  assert:
    # New heading exists
    - type: contains
      value: 'Summary'
    # Original content still intact
    - type: contains
      value: 'A list of list features'
    # Summary comes after existing content (not prepended)
    - type: javascript
      value: output.indexOf('Summary') > output.indexOf('All sorts of lists are supported')

# =============================================================================
# MEMORANDUM TESTS -- real legal document with headings, lists, dates, amounts
# =============================================================================

# --- READING & COMPREHENSION ---

- description: 'Memo: Agent reads the full memorandum'
  vars:
    fixture: memorandum.docx
    task: 'Get the full text of this document.'
  assert:
    - type: contains
      value: 'MEMORANDUM'
    - type: contains
      value: 'General Counsel'
    - type: contains
      value: 'Interim Operating Covenants'
    - type: contains
      value: '$25,000,000'

- description: 'Memo: Agent finds specific section content'
  vars:
    fixture: memorandum.docx
    task: 'Find the section about Employee Matters and tell me what it says about hiring.'
  assert:
    - type: contains
      value: 'Employee Matters'
    - type: contains
      value: 'hiring'

# --- FIND AND REPLACE ---

- description: 'Memo: Replace party name throughout document'
  vars:
    fixture: memorandum.docx
    task: 'Replace "General Counsel" with "Chief Legal Officer" everywhere in the document.'
  assert:
    - type: contains
      value: 'Chief Legal Officer'
    - type: not-contains
      value: 'General Counsel'
    # Rest of document intact
    - type: contains
      value: 'OPERATIONAL COVENANTS'
    - type: contains
      value: '$25,000,000'

- description: 'Memo: Replace date in the document'
  vars:
    fixture: memorandum.docx
    task: 'Replace the date "December 30, 2024" with "January 15, 2025".'
  assert:
    - type: contains
      value: 'January 15, 2025'
    - type: not-contains
      value: 'December 30, 2024'

# --- ADD CONTENT ---

- description: 'Memo: Add a new section at the end'
  vars:
    fixture: memorandum.docx
    task: 'Add a new heading "CONFIDENTIALITY NOTICE" at the end of the document, followed by a paragraph that says "This memorandum is privileged and confidential."'
  assert:
    - type: contains
      value: 'CONFIDENTIALITY NOTICE'
    - type: contains
      value: 'privileged and confidential'
    # New content comes after existing content
    - type: javascript
      value: output.indexOf('CONFIDENTIALITY NOTICE') > output.indexOf('[lawyer]')
    # Original content intact
    - type: contains
      value: 'MEMORANDUM'

# --- DOLLAR AMOUNT EDIT ---

- description: 'Memo: Update monetary threshold'
  vars:
    fixture: memorandum.docx
    task: 'Replace the acquisition limit of "$25,000,000" with "$50,000,000".'
  assert:
    - type: contains
      value: '$50,000,000'
    - type: not-contains
      value: '$25,000,000'
    # Other amount untouched
    - type: contains
      value: '$150,000,000'

# --- MULTI-STEP EDIT ---

- description: 'Memo: Replace lawyer placeholder with actual name'
  vars:
    fixture: memorandum.docx
    task: 'Replace "[lawyer]" with "Sarah Chen, Partner" at the end of the document.'
  assert:
    - type: contains
      value: 'Sarah Chen, Partner'
    - type: not-contains
      value: '[lawyer]'
    # Document structure intact
    - type: contains
      value: 'Best regards,'

# =============================================================================
# EXPORT TESTS -- edit and save the DOCX to results/output/
# =============================================================================

- description: 'Export: add paragraph and save'
  vars:
    fixture: document.docx
    keepFile: true
    task: 'Add a new paragraph at the end of the document that says exactly "EXPORT TEST MARKER".'
  assert:
    - type: contains
      value: 'EXPORT TEST MARKER'
    - type: contains
      value: 'A list of list features'

- description: 'Export: find-and-replace and save'
  vars:
    fixture: memorandum.docx
    keepFile: true
    task: 'Replace "General Counsel" with "Chief Legal Officer" everywhere in the document.'
  assert:
    - type: contains
      value: 'Chief Legal Officer'
    - type: not-contains
      value: 'General Counsel'
    - type: contains
      value: 'OPERATIONAL COVENANTS'

- description: 'Export: add heading and save'
  vars:
    fixture: memorandum.docx
    keepFile: true
    task: 'Add a heading "APPENDIX A" at the end of the document.'
  assert:
    - type: contains
      value: 'APPENDIX A'
    - type: contains
      value: 'MEMORANDUM'

- description: 'Export: dollar amount edit and save'
  vars:
    fixture: memorandum.docx
    keepFile: true
    task: 'Replace "$25,000,000" with "$75,000,000" in the document.'
  assert:
    - type: contains
      value: '$75,000,000'
    - type: not-contains
      value: '$25,000,000'
    - type: contains
      value: '$150,000,000'

# =============================================================================
# CUSTOMER PROMPT TESTS -- from Sample LLM Prompts spreadsheet
# Real editing tasks customers would ask for, executed on real documents.
# =============================================================================

- description: 'Customer: Replace placeholder throughout memo'
  vars:
    fixture: memorandum.docx
    task: 'Replace every instance of "Acquiror" with "Buyer" in this document.'
  assert:
    - type: contains
      value: 'Buyer'
    - type: not-contains
      value: 'Acquiror'
    - type: contains
      value: 'MEMORANDUM'

- description: 'Customer: Replace shall with must'
  vars:
    fixture: memorandum.docx
    task: 'Find every "shall" and replace it with "must" in this document.'
  assert:
    - type: not-contains
      value: 'shall'
    - type: contains
      value: 'MEMORANDUM'

- description: 'Customer: Insert CONFIDENTIAL at top'
  vars:
    fixture: memorandum.docx
    task: 'Insert the word "CONFIDENTIAL" at the very top of the document.'
  assert:
    - type: contains
      value: 'CONFIDENTIAL'
    - type: javascript
      value: output.indexOf('CONFIDENTIAL') < output.indexOf('MEMORANDUM')

- description: 'Customer: Add heading and summary at top'
  vars:
    fixture: memorandum.docx
    task: 'Add a heading called "EXECUTIVE SUMMARY" at the top of the document, followed by a paragraph that says "This memo outlines key obligations for the interim period."'
  assert:
    - type: contains
      value: 'EXECUTIVE SUMMARY'
    - type: contains
      value: 'key obligations'
    - type: javascript
      value: output.indexOf('EXECUTIVE SUMMARY') < output.indexOf('OPERATIONAL COVENANTS')

- description: 'Customer: Replace go-shop date'
  vars:
    fixture: memorandum.docx
    task: 'Replace the go-shop period date "March 1-31, 2025" with "April 1-30, 2025" in the document.'
  assert:
    - type: contains
      value: 'April 1-30, 2025'
    - type: not-contains
      value: 'March 1-31, 2025'

- description: 'Customer: Replace Net terms'
  vars:
    fixture: memorandum.docx
    task: 'Replace "reasonable best efforts" with "commercially reasonable efforts" everywhere in the document.'
  assert:
    - type: contains
      value: 'commercially reasonable efforts'
    - type: not-contains
      value: 'reasonable best efforts'
    - type: contains
      value: 'OPERATIONAL COVENANTS'
