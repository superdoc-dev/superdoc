# =============================================================================
# TRACKED CHANGES -- edit with suggestions
# =============================================================================

- description: 'Tracked change uses changeMode tracked'
  metadata: { category: tracked_changes }
  vars:
    task: 'Suggest replacing "annual review" with "quarterly review" using tracked changes so it can be reviewed.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:isTrackedMode            # changeMode === "tracked"
      metric: correctness

- description: 'Direct edit does not use tracked mode'
  metadata: { category: tracked_changes }
  vars:
    task: 'Replace "draft" with "final version" in the document title. Apply the change directly.'
  assert:
    - type: javascript
      value: file://lib/checks.cjs:isNotTrackedMode          # changeMode !== "tracked"
      metric: correctness

- description: 'Redline liability clause (customer prompt)'
  metadata: { category: tracked_changes, source: spreadsheet }
  vars:
    task: 'Redline the limitation of liability clause to cap liability at 12 months of fees. Use tracked changes.'
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection
    - type: javascript
      value: file://lib/checks.cjs:isTrackedMode
      metric: correctness

