name: Behavior Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main, stable]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-behavior-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs --suite behavior

  test:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build SuperDoc
        run: pnpm build

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
        working-directory: tests/behavior

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: tests/behavior

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
        working-directory: tests/behavior

      - name: Run behavior tests (${{ matrix.browser }} shard ${{ matrix.shard }}/4)
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
        working-directory: tests/behavior

  validate:
    name: Behavior Tests / validate
    needs: [gate, test]
    # always() + explicit gate-result check - see ci-superdoc.yml for the rationale.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.gate.result }}" != "success" ]]; then
            echo "Gate did not succeed (result: ${{ needs.gate.result }})."
            exit 1
          fi

          if [[ "${{ needs.gate.outputs.should_run }}" != "true" ]]; then
            echo "Workflow not required for this PR."
            exit 0
          fi

          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
