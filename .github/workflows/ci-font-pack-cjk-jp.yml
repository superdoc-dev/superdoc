name: Font pack CJK JP CI

on:
  pull_request:
    paths:
      - 'packages/font-pack-cjk-jp/**'
      - 'shared/font-system/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ci-font-pack-cjk-jp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package
        run: pnpm --filter @superdoc-dev/font-pack-cjk-jp check

      - name: Verify npm package contents
        run: pnpm --filter @superdoc-dev/font-pack-cjk-jp exec npm pack --dry-run
