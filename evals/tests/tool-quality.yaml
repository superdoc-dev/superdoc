# Tool quality tests -- tool selection, argument structure, correctness rules, and workflows.
#
# Profiles (set via vars.profile) auto-run check bundles:
#   base:     noHallucinatedParams
#   reading:  noHallucinatedParams
#   mutation: noHallucinatedParams, validOpNames, stepFields, noRequireAny, noMixedBatch
#   tracked:  mutation checks + isTrackedMode
#   format:   noHallucinatedParams, validOpNames, stepFields, correctFormatArgs
#
# Extra checks via vars.checks: [checkName, ...]

# =============================================================================
# TOOL SELECTION -- does the model pick the right tool?
# =============================================================================

- description: 'Text search calls query_match with text selector'
  metadata: { category: reading }
  vars:
    task: 'Find all paragraphs containing the word "Introduction" in the document.'
    profile: reading
    checks: [textSearchArgs]
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      weight: 2
      metric: tool_selection

- description: 'Node search calls query_match with node selector'
  metadata: { category: reading }
  vars:
    task: 'List all headings in the document.'
    expectedNodeType: heading
    profile: reading
    checks: [nodeSearchArgs]
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      weight: 2
      metric: tool_selection

- description: 'Get document text calls get_document_text'
  metadata: { category: reading }
  vars:
    task: 'Show me the full text content of this document.'
  assert:
    - type: tool-call-f1
      value: [get_document_text]
      threshold: 1.0
      metric: tool_selection

- description: 'Get node by ID calls get_node_by_id'
  metadata: { category: reading }
  vars:
    task: 'Get the contents of the node with ID "abc123".'
  assert:
    - type: tool-call-f1
      value: [get_node_by_id]
      threshold: 1.0
      metric: tool_selection

- description: 'Formatting request calls a tool (not text)'
  metadata: { category: reading }
  vars:
    task: 'I need to change the font of a paragraph to Arial.'
  assert:
    - type: javascript
      metric: tool_selection
      value: output.length > 0

# =============================================================================
# ARGUMENT ACCURACY -- are the arguments correct?
# =============================================================================

- description: 'apply_mutations uses text.rewrite (not bare replace)'
  metadata: { category: arguments }
  vars:
    task: 'Replace the text "old title" with "new title" in the document.'
    profile: mutation
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'apply_mutations steps have op and where fields'
  metadata: { category: arguments }
  vars:
    task: 'Delete the sentence "remove this text" from the document.'
    profile: mutation
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'No hallucinated doc or sessionId parameters'
  metadata: { category: arguments }
  vars:
    task: 'Get the text of the entire document.'

- description: 'discover_tools passes valid group names'
  metadata: { category: arguments }
  vars:
    task: 'I want to work with tables in the document. Load the table editing tools.'
    expectedGroup: tables
    checks: [validDiscoverGroups]
  assert:
    - type: tool-call-f1
      value: [discover_tools]
      threshold: 1.0
      metric: tool_selection

# =============================================================================
# CORRECTNESS RULES -- production patterns from labs
# =============================================================================

- description: 'Heading uses create_heading, not text.insert'
  metadata: { category: correctness }
  vars:
    task: 'Add a new heading "Chapter 2" at the end of the document.'
    profile: mutation
    checks: [noTextInsertForStructure]
  assert:
    - type: tool-call-f1
      value: [create_heading, discover_tools]
      threshold: 0.5
      metric: tool_selection

- description: 'Paragraph uses create_paragraph or discover_tools'
  metadata: { category: correctness }
  vars:
    task: 'Add a new paragraph at the end of the document.'
  assert:
    - type: tool-call-f1
      value: [create_paragraph, discover_tools]
      threshold: 0.5
      metric: tool_selection

- description: 'Mutation where uses require "first" not "any"'
  metadata: { category: correctness }
  vars:
    task: 'Replace the first occurrence of "draft" with "final" in the document.'
    profile: mutation
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'format.apply uses inline object structure'
  metadata: { category: correctness }
  vars:
    task: 'Make the word "Important" bold in the document.'
    profile: format
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'Does not combine rewrite and format in one batch'
  metadata: { category: correctness }
  vars:
    task: 'Replace "old text" with "new text" and make it bold.'
    profile: mutation

- description: 'Comment request discovers comments group'
  metadata: { category: correctness }
  vars:
    task: 'Add a comment on the first paragraph saying "Needs legal review".'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# WORKFLOWS -- real editing patterns
# =============================================================================

- description: 'Find clause and rewrite it'
  metadata: { category: workflow }
  vars:
    task: 'Find the indemnification clause and rewrite it to limit liability to $1,000,000.'
  assert:
    - type: tool-call-f1
      value: [query_match]
      threshold: 1.0
      metric: tool_selection

- description: 'Find and replace throughout document'
  metadata: { category: workflow }
  vars:
    task: 'Replace all mentions of "Company A" with "Acme Corp" throughout the document.'
    profile: mutation
    checks: [usesRewriteOp]
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'Edit with tracked changes uses changeMode tracked'
  metadata: { category: tracked_changes }
  vars:
    task: 'Suggest replacing "annual review" with "quarterly review" using tracked changes so it can be reviewed.'
    profile: tracked
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'Direct edit does not use tracked mode'
  metadata: { category: tracked_changes }
  vars:
    task: 'Replace "draft" with "final version" in the document title. Apply the change directly.'
    checks: [isNotTrackedMode]

- description: 'Compound task starts with query'
  metadata: { category: workflow }
  vars:
    task: 'Find the termination clause. Rewrite it to allow either party to terminate with 30 days notice. Add a comment explaining the change.'
  assert:
    - type: tool-call-f1
      value: [query_match, discover_tools, apply_mutations]
      threshold: 0.3
      metric: tool_selection

- description: 'Simple task uses 3 or fewer tool calls'
  metadata: { category: efficiency }
  vars:
    task: 'Replace the word "hello" with "goodbye" in the document.'
  assert:
    - type: javascript
      metric: efficiency
      value: output.length <= 3

- description: 'List conversion discovers lists group'
  metadata: { category: lists }
  vars:
    task: 'Convert the bullet points in section 2 into a numbered list.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

- description: 'List indent discovers lists group'
  metadata: { category: lists }
  vars:
    task: 'Indent the second and third items in the action items list.'
  assert:
    - type: tool-call-f1
      value: [discover_tools, query_match]
      threshold: 0.5
      metric: tool_selection

- description: 'Multiple atomic edits in one batch'
  metadata: { category: mutations }
  vars:
    task: 'Replace "Q1" with "Quarter 1" and "Q2" with "Quarter 2" in the financial summary. Do both changes atomically.'
    profile: mutation
    checks: [atomicMultiStep]
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

- description: 'Delete uses text.delete op'
  metadata: { category: mutations }
  vars:
    task: 'Remove the sentence "This is a draft document." from the introduction.'
    profile: mutation
    checks: [usesDeleteOp]
  assert:
    - type: tool-call-f1
      value: [query_match, apply_mutations]
      threshold: 0.5
      metric: tool_selection

# =============================================================================
# UNDO -- unique from cross-provider tests
# =============================================================================

- description: 'Undo calls undo tool'
  metadata: { category: history }
  vars:
    task: 'Undo that last change, it was wrong.'
  assert:
    - type: tool-call-f1
      value: [undo]
      threshold: 1.0
      metric: tool_selection

