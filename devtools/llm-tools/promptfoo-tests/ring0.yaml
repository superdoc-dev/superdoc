- description: "ring0/find_service_provider_instances"
  threshold: 1
  vars:
    test_id: "find_service_provider_instances"
  assert: &ring0_assertions
    - type: javascript
      metric: no_error_steps
      value: file://./src/assertions/assert-no-error-steps.cjs
    - type: javascript
      metric: required_subsequence_present
      value: file://./src/assertions/assert-required-subsequence.cjs
    - type: javascript
      metric: no_hallucinated_tools
      value: file://./src/assertions/assert-no-hallucinated-tools.cjs
    - type: javascript
      metric: find_content_total
      value: file://./src/assertions/assert-find-content-total.cjs
    - type: javascript
      metric: expected_block_ids_present
      value: file://./src/assertions/assert-expected-block-ids.cjs
    - type: javascript
      metric: final_answer_quality
      value: file://./src/assertions/assert-final-answer-quality.cjs

