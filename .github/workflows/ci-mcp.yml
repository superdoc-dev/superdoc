name: CI MCP

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-mcp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs --suite mcp

  validate:
    name: CI MCP / validate
    needs: gate
    # Run when gate succeeded with should_run='true' (do work) OR when the
    # gate itself failed (so we can fail explicitly below). If gate succeeded
    # with should_run='false', this job is skipped, which counts as success
    # for required status checks.
    if: always() && (needs.gate.result != 'success' || needs.gate.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify gate succeeded
        if: needs.gate.result != 'success'
        run: |
          echo "Gate did not succeed (result: ${{ needs.gate.result }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK artifacts
        run: pnpm run generate:all

      - name: Build superdoc (dependency)
        run: pnpm run build:superdoc

      - name: Build SDK (dependency)
        run: pnpm --prefix packages/sdk/langs/node run build

      - name: Build
        run: pnpm --prefix apps/mcp run build

      - name: Test
        run: pnpm --prefix apps/mcp run test
