name: CI SDK

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-sdk-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Path filtering lives in the gate job (not at the trigger level) so the
  # workflow always produces check runs for every PR. When gate says the
  # change does not affect this workflow, downstream jobs skip via if:
  # condition — skipped jobs count as success for required status checks,
  # while trigger-level path skips leave required checks pending forever.
  # See .github/package-impact-map.md for the canonical per-package paths.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/sdk/**'
              - 'apps/cli/**'
              - 'packages/document-api/**'
              - 'packages/superdoc/**'
              - 'packages/super-editor/**'
              - 'packages/layout-engine/**'
              - 'packages/word-layout/**'
              - 'packages/preset-geometry/**'
              - 'shared/**'
              - 'scripts/generate-all.mjs'
              - 'scripts/semantic-release/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci-sdk.yml'

  validate:
    name: CI SDK / validate
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate all artifacts
        run: pnpm run generate:all

      - name: Build Node SDK
        run: pnpm --prefix packages/sdk/langs/node run build

      - name: Validate SDK
        run: node packages/sdk/scripts/sdk-validate.mjs
